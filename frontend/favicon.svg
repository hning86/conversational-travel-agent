<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="dot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFB700" />
            <stop offset="100%" stop-color="#ff8c00" />
        </linearGradient>
    </defs>
    <!-- Main Yellow/Orange Dot Circle -->
    <circle cx="50" cy="50" r="45" fill="url(#dot-grad)" />
    
    <!-- Active Online Green Indicator (with dark blue border container) -->
    <circle cx="80" cy="80" r="15" fill="#003580" />
    <circle cx="80" cy="80" r="10" fill="#10b981" />
